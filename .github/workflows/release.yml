name: Release

# Push a tag like v0.2.0 to build binaries and publish a GitHub Release.
# Release notes: docs/releases/<tag>.md if it exists, else the tag message.
# (Prefer the file: git strips lines starting with "#" from tag messages, so
# Markdown headings are lost unless the tag is created with --cleanup=verbatim.)
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: test
        run: go test -race -count=1 ./...

      - name: build binaries
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            name="lawliet_${os}_${arch}"
            bin="lawliet"; [ "$os" = windows ] && bin="lawliet.exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath \
              -ldflags "-s -w -X github.com/tranbaohieu/lawliet/internal/version.Version=${TAG}" \
              -o "build/$name/$bin" ./cmd/lawliet
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          ls -l dist

      # For the wheels job (artifacts keep the paths, not the exec bit: the wheel hook sets it).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries
          path: build/

      - name: smoke test linux/amd64 binary
        run: |
          tar -xzf dist/lawliet_linux_amd64.tar.gz -C /tmp
          /tmp/lawliet_linux_amd64/lawliet --version | tee /dev/stderr | grep -q "${GITHUB_REF_NAME}"

      - name: checksums
        run: (cd dist && sha256sum * > checksums.txt && cat checksums.txt)

      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -f "docs/releases/${TAG}.md" ]; then
            cp "docs/releases/${TAG}.md" notes.md
          else
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            git tag -l --format='%(contents)' "$TAG" > notes.md
          fi
          gh release create "$TAG" dist/* --title "Lawliet $TAG" --notes-file notes.md --verify-tag

  # Python wheels from the binaries above, added to the release afterwards: a failure
  # here does not block the binary release.
  wheels:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: binaries
          path: build

      # One wheel per target (python/hatch_build.py). LAWLIET_BINARY is relative to the
      # repository root on purpose: the same path users and CI use.
      - name: build Python wheels
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "__version__ = \"${TAG#v}\"" > python/src/lawliet/_version.py
          python -m pip install build
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os=${target%/*}; arch=${target#*/}
            bin="lawliet"; [ "$os" = windows ] && bin="lawliet.exe"
            LAWLIET_TARGET=$target LAWLIET_BINARY="build/lawliet_${os}_${arch}/$bin" \
              python -m build --wheel --outdir dist-python python
          done
          ls -l dist-python

      - name: smoke test linux/amd64 wheel
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist-python/*manylinux*_x86_64*.whl
          /tmp/venv/bin/lawliet --version | tee /dev/stderr | grep -q "${GITHUB_REF_NAME}"
          /tmp/venv/bin/python -c "import lawliet; r = lawliet.start(); assert r.ping(); lawliet.stop()"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: python-wheels
          path: dist-python/*.whl

      - name: add wheels to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          (cd dist-python && sha256sum *.whl > checksums-python.txt && cat checksums-python.txt)
          gh release upload "$TAG" dist-python/*.whl dist-python/checksums-python.txt

  # Publishes the wheels to PyPI with trusted publishing (no token stored in GitHub).
  # Off until the repository variable PYPI_PUBLISH is "true"; first configure a trusted
  # publisher on pypi.org for this repository, workflow release.yml, environment "pypi".
  pypi:
    needs: wheels
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: python-wheels
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
